name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python tools/validate_repository.py
      - run: python -m unittest discover -s tests
      - run: python tools/release_check.py

  filesystem-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/validate_repository.py
      - run: python -m unittest discover -s tests

  android-demo:
    name: Android demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/android-profile-refresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain

  ios-demo:
    name: iOS demo
    runs-on: macos-latest
    defaults:
      run:
        working-directory: examples/ios-profile-refresh
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -project ProfileRefreshDemo.xcodeproj -scheme ProfileRefreshDemo -destination 'platform=iOS Simulator,name=iPhone 16' test
