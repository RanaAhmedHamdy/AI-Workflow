name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build and validate release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Validate tag and repository
        run: |
          python tools/version_check.py --tag "$GITHUB_REF_NAME"
          python tools/validate_repository.py
          python -m unittest discover -s tests
      - name: Build wheel and sdist
        run: python -m build --wheel --sdist --outdir dist
      - name: Build clean source ZIP
        run: python tools/build_release.py --output-dir dist
      - name: Validate artifacts and record identity
        run: |
          python tools/package_check.py dist/*.whl dist/*.tar.gz dist/*-source.zip
          sha256sum dist/*.whl dist/*.tar.gz dist/*-source.zip > dist/SHA256SUMS
          python tools/create_release_manifest.py --artifact-dir dist --output dist/RELEASE_MANIFEST.json
      - name: Generate build provenance attestations
        uses: actions/attest@v4
        with:
          subject-path: 'dist/*'
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: dist
      - name: Create prerelease with validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "AI-Workflow ${GITHUB_REF_NAME#v}" --prerelease --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" dist/*

  pypi:
    name: Publish validated wheel and sdist to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: dist
      - name: Select PyPI distributions from validated artifact set
        run: |
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pypi-dist
